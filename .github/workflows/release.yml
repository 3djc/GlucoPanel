name: Release

# Push a tag such as v1.0.0 to build both firmwares and publish them as a GitHub release.
# "Run workflow" (manual) builds them without publishing, to check that the build works.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: reterminal_e1001
            name: glucopanel-reterminal-e1001
          - env: jc3248w535
            name: glucopanel-jc3248w535
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio esptool==5.4.0
      - run: pio run -e ${{ matrix.env }}
      - run: tools/package_release.sh ${{ matrix.env }} ${{ matrix.name }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.bin > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Prebuilt GlucoPanel firmware. See [INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/INSTALL.md) for how to flash it.

          | Device | First install (flash at 0x0) | Update (flash at 0x10000) |
          | --- | --- | --- |
          | Seeed reTerminal E1001 | `glucopanel-reterminal-e1001-full.bin` | `glucopanel-reterminal-e1001-update.bin` |
          | Guition JC3248W535 | `glucopanel-jc3248w535-full.bin` | `glucopanel-jc3248w535-update.bin` |

          Not a medical device: do not use it for treatment decisions. Licensed under PolyForm Noncommercial 1.0.0.
          NOTES
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --notes-file notes.md
