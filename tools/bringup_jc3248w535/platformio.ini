; Bring-up test for the Guition JC3248W535 (ESP32-S3, 3.5" 320x480 AXS15231B QSPI display, capacitive touch).
; Not part of the GlucoPanel firmware: it only checks the display, the backlight, the touch controller and
; the BOOT button on a real board. Build and flash from this folder: `pio run -t upload`, then `pio device monitor`.
; GFX Library for Arduino: 1.6.0 (the version a community write-up used) does not compile against the current Arduino
; core 3.3.x; 1.6.9 is the current one. If the panel misbehaves, the pin is the first thing to vary.
[env:jc3248w535]
; pioarduino platform: Arduino core 3.x, which GFX Library for Arduino 1.6.0 needs (the stock platform has core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram = enabled
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Use the chip's built-in USB-Serial-JTAG (hardware CDC), NOT Arduino's TinyUSB serial. This board definition
    ; does not set it, and with TinyUSB esptool cannot reset the chip into the bootloader (no automatic upload).
    -DARDUINO_USB_MODE=1
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
