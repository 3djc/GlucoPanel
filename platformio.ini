[env:reterminal_e1001]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
    -I include
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/tzapu/WiFiManager.git
; Native SDL2 simulator: `pio run -e sim -t exec` (needs `brew install sdl2`)
[env:sim]
platform = native
build_src_filter = +<main.cpp> +<wifi_setup.cpp> +<config.cpp> +<config_server.cpp> +<glucose.cpp> +<display.cpp> +<ui.cpp> +<graph.cpp> +<lvgl_port.cpp> +<font_big_96.c> +<font_big_128.c> +<../sim/http_sim.cpp> +<../sim/sim_main.cpp>
lib_deps =
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@^7.0.0
lib_compat_mode = off
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I sim/include
    -I sim
    -I include
    -std=gnu++17
    !sdl2-config --cflags
    !sdl2-config --libs
    -lcurl
