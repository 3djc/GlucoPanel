[env:reterminal_e1001]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM
    -I src
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/tzapu/WiFiManager.git
    ricmoo/QRCode@^0.0.1
; Native SDL2 simulator: `pio run -e sim -t exec` (needs `brew install sdl2`)
[env:sim]
platform = native
build_src_filter = +<main.cpp> +<wifi_setup.cpp> +<../sim/sim_main.cpp>
lib_deps = ricmoo/QRCode@^0.0.1
lib_compat_mode = off
build_flags =
    -I sim/include
    -I sim
    -std=gnu++17
    !sdl2-config --cflags
    !sdl2-config --libs
