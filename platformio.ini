[env:reterminal_e1001]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
    -I include
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/tzapu/WiFiManager.git
; Guition JC3248W535 (ESP32-S3, 3.5" 480x320 colour touch display). Needs the pioarduino platform (Arduino core 3.x).
; USB: the chip's own USB-Serial-JTAG (ARDUINO_USB_MODE=1); without it uploads need the BOOT button.
[env:jc3248w535]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram = enabled
board_build.partitions = default_16MB.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D UI_PROFILE_LCD
    -I src
    -I include
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/tzapu/WiFiManager.git

; Native SDL2 simulator: `pio run -e sim -t exec` (needs `brew install sdl2`)
[env:sim]
platform = native
build_src_filter = +<main.cpp> +<wifi_setup.cpp> +<config.cpp> +<config_server.cpp> +<glucose.cpp> +<display.cpp> +<ui.cpp> +<graph.cpp> +<cells.cpp> +<i18n.cpp> +<secrets.cpp> +<lvgl_port.cpp> +<profile.cpp> +<input.cpp> +<night.cpp> +<font_*.c> +<../sim/http_sim.cpp> +<../sim/sim_main.cpp>
lib_deps =
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@^7.0.0
lib_compat_mode = off
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I sim/include
    -I sim
    -I include
    -std=gnu++17
    !sdl2-config --cflags
    !sdl2-config --libs
    -lcurl

; Same simulator with the colour 480x320 profile of the Guition JC3248W535 (the mouse is the touch screen).
[env:sim_lcd]
platform = native
build_src_filter = +<main.cpp> +<wifi_setup.cpp> +<config.cpp> +<config_server.cpp> +<glucose.cpp> +<display.cpp> +<ui.cpp> +<graph.cpp> +<cells.cpp> +<i18n.cpp> +<secrets.cpp> +<lvgl_port.cpp> +<profile.cpp> +<input.cpp> +<night.cpp> +<font_*.c> +<../sim/http_sim.cpp> +<../sim/sim_main.cpp>
lib_deps =
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@^7.0.0
lib_compat_mode = off
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D UI_PROFILE_LCD
    -I sim/include
    -I sim
    -I include
    -std=gnu++17
    !sdl2-config --cflags
    !sdl2-config --libs
    -lcurl
